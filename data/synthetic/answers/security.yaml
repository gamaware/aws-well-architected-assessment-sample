pillar: security
name: Security
lens: wellarchitected
questions:
  SEC01: How do you securely operate your workload?
  SEC02: How do you manage authentication for people and machines?
  SEC03: How do you manage permissions for people and machines?
  SEC04: How do you detect and investigate security events?
  SEC06: How do you protect your compute resources?
  SEC08: How do you protect your data at rest?
  SEC10: How do you anticipate, respond to, and recover from incidents?
  SEC11: >-
    How do you incorporate and validate the security properties of applications throughout the design, development,
    and deployment lifecycle?
items:
  - id: SEC01-BP01
    question: SEC01
    title: Separate workloads using accounts
    status: met
    evidence: [EV-01, EV-08]
    observation: Production, staging and shared tooling run in separate accounts in one AWS Organizations organization.
  - id: SEC02-BP02
    question: SEC02
    title: Use temporary credentials
    status: not_met
    risk: high
    effort: S
    owner: Platform lead
    evidence: [EV-04, EV-05]
    observation: >-
      GitHub Actions deploys with the long-lived access key of the IAM user ci-deployer, stored as a repository
      secret. {access_keys.active_over_90_days} active access keys in production are older than 90 days; the oldest is
      {access_keys.oldest_age_days} days old.
    recommendation: >-
      Replace the ci-deployer key with GitHub OIDC federation to an IAM role scoped to the repository and the
      production environment, then deactivate and delete the key.
  - id: SEC02-BP03
    question: SEC02
    title: Store and use secrets securely
    status: partial
    risk: medium
    effort: S
    owner: Backend engineers
    evidence: [EV-02, EV-13]
    observation: >-
      The database password sits in AWS Secrets Manager, but the logistics partner API token is a plain-text ECS
      environment variable and was rotated by hand after it expired (INC-105).
    recommendation: >-
      Move the partner token to Secrets Manager, inject it through the task definition `secrets` field, and set a
      rotation reminder or automatic rotation.
  - id: SEC03-BP02
    question: SEC03
    title: Grant least privilege access
    status: not_met
    risk: high
    effort: M
    owner: Platform lead
    depends_on: [SEC02-BP02]
    evidence: [EV-05, EV-08]
    observation: >-
      ci-deployer and ops-admin-2 hold AdministratorAccess. {access_keys.console_users_without_mfa} console user in
      production has no MFA.
    recommendation: >-
      Give the new deploy role only the ECS, ECR and Terraform state permissions it uses, move people to IAM
      Identity Center permission sets, and enforce MFA.
  - id: SEC04-BP01
    question: SEC04
    title: Configure service and application logging
    status: partial
    risk: medium
    effort: S
    owner: Platform lead
    evidence: [EV-09, EV-12]
    observation: >-
      An organization CloudTrail trail exists, but ALB access logs are off and the Aurora PostgreSQL log is not
      exported to CloudWatch Logs.
    recommendation: >-
      Enable ALB access logs to S3 and export the Aurora PostgreSQL log, each with a retention period that matches
      the investigation needs.
  - id: SEC06-BP01
    question: SEC06
    title: Perform vulnerability management
    status: partial
    risk: medium
    effort: S
    owner: Platform lead
    evidence: [EV-12]
    observation: >-
      Amazon Inspector scans ECR images, but its findings go to nobody and the storefront image carries 11 critical
      findings with fixes available.
    recommendation: >-
      Route Inspector critical and high findings to the team channel, rebuild images weekly on a patched base image,
      and fail the pipeline on critical findings that have a fix.
  - id: SEC08-BP02
    question: SEC08
    title: Enforce encryption at rest
    status: met
    evidence: [EV-10, EV-12]
    observation: Aurora, ElastiCache, SQS and S3 are encrypted with AWS KMS keys; default EBS encryption is on.
  - id: SEC10-BP02
    question: SEC10
    title: Develop incident management plans
    status: not_met
    risk: medium
    effort: S
    owner: Head of engineering
    depends_on: [OPS10-BP01]
    evidence: [EV-02]
    observation: There is no security incident plan; the team did not know who would decide to rotate every credential.
    recommendation: >-
      Write a one-page security incident plan (roles, contacts, first actions for a leaked key) and rehearse it once
      as a tabletop exercise.
  - id: SEC11-BP02
    question: SEC11
    title: Automate testing throughout the development and release lifecycle
    status: not_met
    risk: medium
    effort: M
    owner: Backend engineers
    depends_on: [OPS05-BP02]
    evidence: [EV-04]
    observation: No static analysis, dependency scanning or infrastructure-as-code scanning runs in the pipelines.
    recommendation: >-
      Add Semgrep, dependency scanning and Checkov to pull request checks, starting in report-only mode and
      failing on new high findings after two weeks.
