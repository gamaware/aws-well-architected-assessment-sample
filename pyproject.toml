[project]
name = "aws-well-architected-assessment-sample"
version = "1.0.0"
description = "Scores a fictional AWS Well-Architected and DevOps assessment and exports a risk-rated backlog."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["pyyaml==6.0.3"]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.16.9"]
report = ["weasyprint==70.0"]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.pytest.ini_options]
pythonpath = ["scripts", "tests"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "S"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]
