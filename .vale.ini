StylesPath = styles
MinAlertLevel = warning

Packages = write-good, proselint

[*.md]
BasedOnStyles = write-good, proselint
# Official AWS best-practice title quoted verbatim (REL09-BP01); rewording it would misquote AWS.
TokenIgnores = (needs to be backed up)

# The report and evidence quote AWS best-practice titles verbatim ("Implement ...", "Monitor ...", "Validate ...").
# TooWordy flags those verbs; rewording them would misquote AWS, so the rule is off for these two paths only.
[{report,evidence}/*.md]
BasedOnStyles = write-good, proselint
TokenIgnores = (needs to be backed up)
write-good.TooWordy = NO
